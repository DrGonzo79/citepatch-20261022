[project]
name = "citepatch-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.10.19",
    "fastapi==0.120.0",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
